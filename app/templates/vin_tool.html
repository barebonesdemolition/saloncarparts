<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ app_name }} - VIN Lookup</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f8; }
.navbar { background: #0b1e3a; color: white; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; }
.logo { font-size: 22px; font-weight: bold; color: #00a8e8; text-decoration: none; }
.logo span { color: #ffb800; }
.nav-links a { color: white; text-decoration: none; margin-left: 25px; font-size: 14px; }
.hero { background: linear-gradient(135deg, #0b1e3a, #1a3a6b); color: white; padding: 60px 20px 80px; text-align: center; }
.hero h1 { font-size: 38px; margin-bottom: 12px; }
.hero p { opacity: 0.85; margin-bottom: 30px; }
.vin-input-box { max-width: 600px; margin: 0 auto; display: flex; gap: 10px; background: white; padding: 10px; border-radius: 12px; }
.vin-input-box input { flex: 1; padding: 15px; border: none; font-size: 16px; font-family: monospace; letter-spacing: 2px; outline: none; }
.vin-input-box button { background: #00a8e8; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-weight: bold; cursor: pointer; }
.container { max-width: 1000px; margin: -40px auto 40px; padding: 0 20px; position: relative; z-index: 10; }
.result-card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: none; }
.result-card.show { display: block; }
.result-header { display: flex; gap: 15px; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 2px solid #f0f4f8; align-items: center; }
.result-icon { width: 60px; height: 60px; background: linear-gradient(135deg, #00a8e8, #0077b6); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 30px; }
.result-title { font-size: 24px; color: #0b1e3a; font-weight: bold; }
.result-subtitle { color: #666; font-size: 14px; font-family: monospace; }
.specs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
.spec { background: #f4f6f8; padding: 15px; border-radius: 10px; border-left: 4px solid #00a8e8; }
.spec-label { font-size: 12px; color: #888; text-transform: uppercase; font-weight: 600; }
.spec-value { font-size: 18px; font-weight: bold; color: #0b1e3a; margin-top: 5px; }
.parts-section { background: #f0f9ff; border-radius: 10px; padding: 20px; border-left: 4px solid #00a8e8; }
.parts-title { font-weight: bold; color: #0b1e3a; margin-bottom: 12px; }
.parts-list { display: flex; gap: 10px; flex-wrap: wrap; }
.part-tag { background: white; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #0b1e3a; border: 1px solid #cce7f5; }
.error-card { background: #fef2f2; border-radius: 10px; padding: 20px; border-left: 4px solid #dc2626; color: #991b1b; font-weight: 600; display: none; }
.error-card.show { display: block; }
.example-vins { text-align: center; color: #999; font-size: 13px; margin-top: 20px; }
.example-vins span { color: #00a8e8; cursor: pointer; text-decoration: underline; margin: 0 5px; }
</style>
</head>
<body>
<div class="navbar">
<a href="/" class="logo">Salon<span>AutoZone</span> & <span>AutoTrader</span></a>
<div class="nav-links">
<a href="/">🏠 Home</a>
<a href="/login">👤 Login</a>
</div>
</div>
<div class="hero">
<h1>🔍 Free VIN Lookup</h1>
<p>Enter your 17-digit VIN to find out what car you have and what parts it needs.</p>
<div class="vin-input-box">
<input type="text" id="vin-input" placeholder="Enter VIN" maxlength="17" style="text-transform: uppercase;">
<button onclick="lookupVIN()">Decode VIN</button>
</div>
<div class="example-vins">
Try: <span onclick="tryVin('JTDBR32E830123456')">Toyota</span>|
<span onclick="tryVin('JN1TANT31U0001234')">Nissan</span>|
<span onclick="tryVin('1HGCV1F30LA123456')">Honda USA</span>|
<span onclick="tryVin('WBA3A5C55DF123456')">BMW</span>
</div>
</div>
<div class="container">
<div id="error" class="error-card"></div>
<div id="result" class="result-card"></div>
</div>
<script>
function tryVin(v) { document.getElementById('vin-input').value = v; lookupVIN(); }
async function lookupVIN() {
const vin = document.getElementById('vin-input').value.trim().toUpperCase();
const resultEl = document.getElementById('result');
const errorEl = document.getElementById('error');
resultEl.classList.remove('show');
errorEl.classList.remove('show');
if (vin.length !== 17) { errorEl.innerHTML = '❌ VIN must be exactly 17 characters.'; errorEl.classList.add('show'); return; }
try {
const res = await fetch('/api/vin/decode', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ vin }) });
if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Invalid VIN'); }
const d = await res.json();
resultEl.innerHTML = `
<div class="result-header">
<div class="result-icon">🚗</div>
<div>
<div class="result-title">${d.manufacturer}</div>
<div class="result-subtitle">${d.vin}</div>
</div>
</div>
<div class="specs-grid">
<div class="spec"><div class="spec-label">Country</div><div class="spec-value">🌍 ${d.country_of_origin}</div></div>
<div class="spec"><div class="spec-label">Type</div><div class="spec-value">${d.vehicle_type}</div></div>
<div class="spec"><div class="spec-label">Year</div><div class="spec-value">${d.model_year || 'Unknown'}</div></div>
<div class="spec"><div class="spec-label">Plant</div><div class="spec-value">${d.assembly_plant}</div></div>
</div>
<div class="parts-section">
<div class="parts-title">🔧 Common Parts to Check</div>
<div class="parts-list">${d.common_parts_to_check.map(p => '<span class="part-tag">' + p + '</span>').join('')}</div>
</div>
`;
resultEl.classList.add('show');
} catch (err) { errorEl.innerHTML = '❌ ' + err.message; errorEl.classList.add('show'); }
}
document.getElementById('vin-input').addEventListener('keypress', e => { if (e.key === 'Enter') lookupVIN(); });
</script>
</body>
</html>
