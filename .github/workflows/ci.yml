name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: salon_autozone
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d salon_autozone"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check dependencies and syntax
        run: |
          python -m pip check
          python -m compileall -q app tests

      - name: Apply database schema and seed data
        env:
          PGPASSWORD: postgres
        run: |
          psql --set=ON_ERROR_STOP=1 --host=localhost --port=5432 --username=postgres --dbname=salon_autozone --file=schema.sql
          psql --set=ON_ERROR_STOP=1 --host=localhost --port=5432 --username=postgres --dbname=salon_autozone --file=seed.sql

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/salon_autozone
        run: python -m pytest -q